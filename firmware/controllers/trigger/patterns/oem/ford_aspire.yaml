name: "Ford Aspire"
id: TT_FORD_ASPIRE
operation_mode: FOUR_STROKE_CRANK_SENSOR
sync_edge: RiseOnly

channels:
  primary:
    type: custom
    events:
      - { angle: 0.0, edge: rise }
      - { angle: 180.0, edge: fall }
      - { angle: 180.0, edge: rise }
      - { angle: 360.0, edge: fall }

sync:
  use_only_primary: true

metadata:
  tdc_position: 0.0
  is_crank_based: true
  has_second_channel: false
  known_operation_mode: true

notes: |
  Ford Aspire / Kia Festiva
  Simple 2-pulse per revolution pattern
